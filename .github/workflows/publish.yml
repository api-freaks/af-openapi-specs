name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; print; next }
            flag && /^## \[/ { flag=0 }
            flag
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          else
            SUMMARY=$(printf '%s\n' "$SECTION" | grep -m1 '^### ' | sed -E 's/^### [A-Za-z]+ — //')
            printf '%s\n' "$SECTION" > /tmp/release-notes.md
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME — $SUMMARY" --notes-file /tmp/release-notes.md
          fi
